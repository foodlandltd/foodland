<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administratora - FoodLand</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #fcfaf8; margin: 0; padding: 20px; color: #2a2a2a; }
        .admin-panel { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .admin-panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .admin-tabs button { padding: 10px 20px; margin-right: 5px; border: none; background: #eee; cursor: pointer; border-radius: 6px; font-weight: bold; }
        .admin-tabs button.active { background: #d0021b; color: #fff; }
        .admin-tabpage { display: none; }
        .admin-tabpage.active { display: block; }
        .admin-field { margin-bottom: 15px; }
        .admin-field label { display: block; font-weight: bold; margin-bottom: 5px; }
        .admin-field input, .admin-field textarea, .admin-field select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-primary { background: #d0021b; color: #fff; }
        .img-item { display: flex; align-items: center; gap: 10px; background: #f5f5f5; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .img-item img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .btn-delete { background: #d0021b; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="admin-panel" id="adminPanel">
    <header class="admin-panel-head">
        <strong>Panel administratora</strong>
        <a href="index.html" class="btn btn-primary" style="text-decoration: none;">Powrót do sklepu</a>
    </header>
    
    <nav class="admin-tabs" id="adminTabs">
        <button data-tab="texts" class="active">Teksty</button>
        <button data-tab="themes">Motywy</button>
        <button data-tab="images">Zdjęcia</button>
        <button data-tab="stats">Statystyki</button>
    </nav>

    <div class="admin-panel-body">
        <!-- TU BĘDĄ ZAKŁADKI, KTÓRE ZARAZ WKLEIMY -->
        <div class="admin-tabpage active" data-page="texts">
            <p>Tutaj będą ustawienia tekstów.</p>
        </div>
        <div class="admin-tabpage" data-page="themes">
            <p>Tutaj będą ustawienia motywów.</p>
        </div>
        <div class="admin-tabpage" data-page="images">
            <p>Tutaj będą ustawienia zdjęć.</p>
        </div>
        <div class="admin-tabpage" data-page="stats">
            <p>Tutaj będą statystyki.</p>
        </div>
    </div>
</div>

<script>
    // Prosty skrypt do przełączania zakładek w panelu
    document.querySelectorAll('#adminTabs button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('#adminTabs button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.admin-tabpage').forEach(p => p.classList.toggle('active', p.dataset.page === btn.dataset.tab));
        });
    });
</script>

</body>
</html>
